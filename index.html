<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon City Arcade</title>
  <meta name="description" content="A browser-based 3D arcade platform. Explore a neon-lit city street and play arcade games.">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e0f13;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0e0f13;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title {
      font-size: 2.5em;
      font-weight: 700;
      color: #ff6b9d;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .loading-bar-container {
      width: 300px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar {
      width: 0%;
      height: 100%;
      background: #4ecdc4;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .loading-text {
      margin-top: 12px;
      font-size: 0.9em;
      color: #888;
    }
    #loading-error {
      margin-top: 20px;
      padding: 16px 24px;
      background: rgba(255, 118, 117, 0.1);
      border: 1px solid rgba(255, 118, 117, 0.3);
      border-radius: 8px;
      color: #ff7675;
      font-size: 0.85em;
      max-width: 400px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }
    #loading-error.visible {
      display: block;
    }
    #loading-error button {
      margin-top: 12px;
      padding: 8px 16px;
      background: rgba(255, 118, 117, 0.2);
      border: 1px solid rgba(255, 118, 117, 0.4);
      border-radius: 4px;
      color: #ff7675;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
    }
    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #ui-layer > * {
      pointer-events: auto;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading-screen">
      <div class="loading-title">Neon City</div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <div class="loading-text" id="loading-text">Initializing...</div>
      <div id="loading-error">
        <div id="loading-error-message"></div>
        <button onclick="location.reload()">Retry</button>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Fallback: if loading takes more than 10 seconds, show error
    setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      const loadingError = document.getElementById('loading-error');
      if (loadingScreen && !loadingScreen.classList.contains('hidden') && loadingError) {
        loadingError.innerHTML = `
          <strong>Loading timeout</strong><br>
          <span style="opacity: 0.7; font-size: 0.9em;">
            Check browser console for errors (F12)<br>
            Make sure you're using a local dev server
          </span>
          <button onclick="location.reload()" style="margin-top: 12px;">Retry</button>
        `;
        loadingError.classList.add('visible');
      }
    }, 10000);
  </script>
</body>
</html>
